
name: Deploy to WordPress.org

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to deploy"
        required: true
        default: "4.0.8"
        type: string

  push:
    branches:
      - master
    paths:
      - '.github/deploy-4.0.8.txt'
